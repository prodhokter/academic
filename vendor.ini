# Third-party skill sources.
# Format:
#   [<name>]
#   repo   = <git url>
#   commit = <sha>          (optional; omit to track the default branch)
#   skills = <path>, <path> relative to the repo root; a trailing /* means
#            every subdirectory of that path is a skill
#   prefix = <string>       optional prefix when linking into .claude/skills
#
# Licenses stay with each upstream repository; nothing here is redistributed.

[nature-skills]
repo   = https://github.com/Yuan1z0825/nature-skills.git
commit = a1a8220366e82ecd8584ea3d7f46cb3969f4b018
skills = skills/*
prefix =

[research-connectors]
repo   = https://github.com/thurlow-research/ResearchClaudeCodeSkills.git
commit = 92f8dc0ad7882192abf1aae7228c05442f8e8374
skills = skills/*
prefix =

[research-superpower]
repo   = https://github.com/kthorn/research-superpower.git
commit = 2affbfea08b584465207680b906e208de52c4669
skills = skills/research/*, skills/getting-started
prefix =

[academic-humanizer]
repo   = https://github.com/AIScientists-Dev/academic-humanizer.git
commit =
skills = .
prefix =
